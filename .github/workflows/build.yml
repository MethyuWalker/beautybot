name: Build Beauty Salon Bot for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name BeautySalonBot --collect-all aiogram --collect-all aiohttp --collect-all apscheduler --collect-all aiosqlite --collect-all dotenv bot.py

      - name: Prepare delivery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path delivery | Out-Null
          Copy-Item dist/BeautySalonBot.exe delivery/
          @'
          BEAUTY SALON BOT — ИНСТРУКЦИЯ

          1. Распакуйте архив целиком в отдельную папку.
          2. Запустите BeautySalonBot.exe.
          3. При первом запуске введите токен Telegram-бота, Telegram ID администратора,
             телефон салона и пароль веб-панели.
          4. Файлы .env и beauty_salon.db создаются рядом с EXE. Не удаляйте их.
          5. Веб-панель открывается на этом компьютере: http://127.0.0.1:8080.

          Для работы Telegram-бота нужен интернет, а компьютер должен оставаться включённым.
          Не публикуйте файл .env и не передавайте его посторонним.
          '@ | Set-Content -Encoding UTF8 delivery/ИНСТРУКЦИЯ.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BeautySalonBot-Windows
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
